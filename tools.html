<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>seal-check legacy tools redirect</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="index.html" />
  <script type="module">
    import {
      legacyToolsDestination,
      legacyToolsRequestedHash,
      rememberLegacyToolsNavigation,
    } from "./legacy-tools-redirect.js";
    const destination = legacyToolsDestination(location.href);
    rememberLegacyToolsNavigation(sessionStorage, destination, legacyToolsRequestedHash(location));
    location.replace(destination);
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <p>The legacy tools page has been retired. This redirect preserves legacy query
      parameters and deep-link anchors so the seal-check page can say whether a requested
      section still exists.</p>
    <p class="muted">If scripts are disabled, use the link above and add the original query or anchor.</p>
    <p data-claims-not-proves></p>
  </main>
</body>
</html>
