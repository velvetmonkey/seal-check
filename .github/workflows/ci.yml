# SPDX-License-Identifier: Apache-2.0
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --check receipt.js
      - run: node test/receipt-format.test.cjs
      - run: node test/receipt-harness.cjs
      - run: node test/cross-receipt.test.cjs
      - run: node test/receipt-verify.test.cjs
      - run: node test/receipt-format-v3.test.cjs
      - run: node test/receipt-document.test.cjs
      - run: node test/unparseable-forge.test.cjs
      - run: node test/pathological-number.test.cjs
      - run: node test/verify-profile.test.cjs
      - run: node scripts/claims-drift.mjs
      - run: node --test test/claims-drift.test.mjs
      - run: node --test test/page-claims-source.test.mjs
      - run: node --test test/page-merge.test.mjs
      - run: node --test test/page-module-imports.test.mjs
      - run: node scripts/contrast.mjs
