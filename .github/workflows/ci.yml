# SPDX-License-Identifier: Apache-2.0
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --input-type=module --check < app.js
      - run: node --input-type=module --check < receipt.js
      - run: node --input-type=module --check < corpus.js
      - run: node --input-type=module --check < fragment-classifier.js
      - run: node --input-type=module --check < kernel.js
      - run: node --input-type=module --check < legacy-tools-redirect.js
      - run: node --input-type=module --check < page-claims.js
      - run: node --input-type=module --check < protect-receipt.js
      - run: node --input-type=module --check < receipt-format.js
      - run: node --input-type=module --check < receipt-input.js
      - run: node --input-type=module --check < receipt-summary.js
      - run: node --input-type=module --check < seal-config.js
      - run: node --input-type=module --check < seal-wasm.js
      - run: node --input-type=module --check < spine-receipt.js
      - run: node --check theme.js
      - run: node --input-type=module --check < tooltip.js
      - run: node test/receipt-format.test.cjs
      - run: node test/receipt-harness.cjs
      - run: node test/cross-receipt.test.cjs
      - run: node test/receipt-verify.test.cjs
      - run: node test/receipt-format-v3.test.cjs
      - run: node test/receipt-document.test.cjs
      - run: node test/unparseable-forge.test.cjs
      - run: node test/pathological-number.test.cjs
      - run: node test/verify-profile.test.cjs
      - run: node scripts/claims-drift.mjs
      - run: node --test test/claims-drift.test.mjs
      - run: node --test test/page-claims-source.test.mjs
      - run: node --test test/page-merge.test.mjs
      - run: node --test test/page-module-imports.test.mjs
      - run: node --test test/fragment-classifier.test.mjs
      - run: node --test test/receipt-input.test.mjs
      - run: node --test test/receipt-summary.test.mjs
      - run: node test/spine-receipt.test.cjs
      - run: node scripts/contrast.mjs
